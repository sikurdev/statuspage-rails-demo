api_outage:
  uptime_monitor: api
  title: API is down
  status: investigating
  started_at: <%= 30.minutes.ago.to_fs(:db) %>

website_past:
  uptime_monitor: website
  title: Website is down
  status: resolved
  started_at: <%= 10.days.ago.to_fs(:db) %>
  resolved_at: <%= (10.days.ago + 1.hour).to_fs(:db) %>
