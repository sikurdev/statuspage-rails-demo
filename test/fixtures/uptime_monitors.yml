website:
  name: Website
  url: https://status-demo.test/health
  check_interval_seconds: 60
  expected_status: 200
  failure_threshold: 3
  status: up
  active: true
  last_checked_at: <%= 2.minutes.ago.to_fs(:db) %>

api:
  name: API
  url: https://api.status-demo.test/ping
  check_interval_seconds: 300
  expected_status: 204
  failure_threshold: 2
  status: down
  active: true
  last_checked_at: <%= 1.minute.ago.to_fs(:db) %>

paused:
  name: Paused service
  url: https://paused.status-demo.test
  check_interval_seconds: 60
  expected_status: 200
  failure_threshold: 3
  status: pending
  active: false
