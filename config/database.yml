# Single PostgreSQL database per environment. Solid Queue tables live in the
# primary database (see db/migrate/*_create_solid_queue_tables.rb) to keep the
# demo deployable with one Postgres instance.
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 }.to_i + 5 %>
  host: <%= ENV["DATABASE_HOST"] %>
  username: <%= ENV["DATABASE_USERNAME"] %>
  password: <%= ENV["DATABASE_PASSWORD"] %>

development:
  <<: *default
  database: statuspage_development

test:
  <<: *default
  database: statuspage_test

production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "statuspage_production") %>
